name: Build NDS
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          dkp-pacman -Sy --noconfirm nds-dev nds-examples
          T=$(find /opt/devkitpro/examples/nds -type d -path '*templates*' -name arm9 | head -n1)
          cp -r "$T" proj
          rm -f proj/source/*
          cp main.c textures.h proj/source/
          make -C proj
      - uses: actions/upload-artifact@v4
        with:
          name: rumble-forest-ds
          path: proj/*.nds
