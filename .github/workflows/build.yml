
name: Build NDS

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104

    steps:
      - uses: actions/checkout@v4

      - name: Build NDS ROM
        run: |
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git

          T=$(find nds-examples/templates -type d -name arm9 | head -n1)
          test -n "$T"

          cp -r "$T" proj

          sed -i 's/^TARGET :=.*/TARGET := rumble-forest-ds/' proj/Makefile
          sed -i 's/^LIBS := -lnds9$/LIBS := -lnds9 -lm/' proj/Makefile

          rm -f proj/source/*
          cp main.c textures.h proj/source/

          make -C proj clean
          make -C proj all

          echo "=== GENERATED NDS FILES ==="
          find proj -type f -name "*.nds"

          test -f proj/rumble-forest-ds.nds

      - uses: actions/upload-artifact@v4
        with:
          name: rumble-forest-ds
          path: proj/rumble-forest-ds.nds
          if-no-files-found: error
