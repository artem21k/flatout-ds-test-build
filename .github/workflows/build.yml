
name: Build NDS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NDS ROM
        run: |
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git

          T=$(find nds-examples/templates -type d -name arm9 | head -n1)
          test -n "$T"

          cp -r "$T" proj

          sed -i 's|^LIBS := -lnds9$|LIBS := -lnds9 -lm|' proj/Makefile

          sed -i 's|@$(MAKE) --no-print-directory -C $(BUILD) -f $(CURDIR)/Makefile|@$(MAKE) --no-print-directory -C $(BUILD) -f $(CURDIR)/Makefile $(OUTPUT).nds|' proj/Makefile

          rm -f proj/source/*
          cp main.c textures.h proj/source/

          echo "=== VERIFY MAKEFILE ==="
          grep -n 'OUTPUT.*nds\|LIBS :=' proj/Makefile

          echo "=== CLEAN ==="
          make -C proj TARGET=rumble-forest-ds clean

          echo "=== BUILD ==="
          make -C proj TARGET=rumble-forest-ds

          echo "=== GENERATED FILES ==="
          find proj -type f \( -name "*.nds" -o -name "*.elf" \)

          test -f proj/rumble-forest-ds.nds

      - name: Upload NDS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumble-forest-ds
          path: proj/rumble-forest-ds.nds
          if-no-files-found: error
