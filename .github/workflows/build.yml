name: Build NDS

on:
  workflow_dispatch:
  push:
    paths:
      - '**.c'
      - '**.h'
      - '**.py'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-generate cars & textures (if tools exist)
        run: |
          set -eu
          if [ -f "tools/gen_textures.py" ] && [ -f "tools/carspec.py" ]; then
            echo "=== GENERATING CARS & TEXTURES ==="
            mkdir -p source
            pip3 install --quiet numpy pillow scipy || python3 -m pip install --quiet numpy pillow scipy
            python3 tools/gen_textures.py
          else
            echo "No tools/gen_textures.py found, using existing .h files."
          fi

      - name: Build NDS ROM
        run: |
          set -eu

          echo "=== CLONE EXAMPLES ==="
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git

          T=$(find nds-examples/templates -type d -name arm9 | head -n1)
          test -n "$T"
          cp -r "$T" proj

          sed -i 's|^LIBS := -lnds9$|LIBS := -lnds9 -lm|' proj/Makefile

          rm -f proj/source/*
          for f in main.c textures.h cars.h; do
            if [ -f "source/$f" ]; then
              cp "source/$f" proj/source/
            elif [ -f "$f" ]; then
              cp "$f" proj/source/
            else
              echo "ERROR: File $f not found in root or source/!"
              exit 1
            fi
          done

          echo "=== BUILD ARM9 ==="
          make -C proj TARGET=rumble-forest-ds clean
          make -C proj TARGET=rumble-forest-ds

          ARM9_ELF="proj/rumble-forest-ds.elf"
          test -s "$ARM9_ELF"

          echo "=== LOCATE ARM7 ==="
          ARM7_ELF="$DEVKITPRO/calico/bin/ds7_maine.elf"
          if [ ! -s "$ARM7_ELF" ]; then
            ARM7_ELF="$DEVKITPRO/libnds/default.elf"
          fi
          test -s "$ARM7_ELF"
          echo "ARM7: $ARM7_ELF"

          echo "=== CREATE 32x32 ICON ==="
          python3 -c '
import struct
width, height = 32, 32
palette = [
    (0,0,0), (0,0,180), (0,100,255), (0,180,255),
    (0,255,0), (0,180,0), (255,255,0), (255,180,0),
    (255,0,0), (180,0,0), (255,255,255), (180,180,180),
    (100,100,100), (60,60,60), (255,0,255), (0,255,255)
]
pixels = bytearray()
for y in range(height - 1, -1, -1):
    for x in range(0, width, 2):
        c = lambda px, py: (3 if (px + py) % 4 < 2 else 2) if (5 <= px < 27 and 5 <= py < 27) else 1
        pixels.append((c(x, y) << 4) | c(x + 1, y))
pal_data = b"".join(struct.pack("<BBBB", b, g, r, 0) for r, g, b in palette)
offset = 14 + 40 + len(pal_data)
fh = struct.pack("<2sIHHI", b"BM", offset + len(pixels), 0, 0, offset)
dh = struct.pack("<IiiHHIIiiII", 40, width, height, 1, 4, 0, len(pixels), 2835, 2835, 16, 16)
with open("proj/icon.bmp", "wb") as f:
    f.write(fh + dh + pal_data + pixels)
'
          test -s proj/icon.bmp

          echo "=== LOCATE NDSTOOL ==="
          NDSTOOL=$(command -v ndstool || find "$DEVKITPRO" -type f -name ndstool -perm -111 -print -quit)
          test -n "$NDSTOOL"
          echo "NDSTOOL: $NDSTOOL"

          echo "=== CREATE NDS ROM ==="
          "$NDSTOOL" -c proj/rumble-forest-ds.nds \
            -9 "$ARM9_ELF" \
            -7 "$ARM7_ELF" \
            -b proj/icon.bmp \
            "RumbleForest;Homebrew;devkitPro"

          echo "=== VERIFY ROM ==="
          ls -lh proj/rumble-forest-ds.nds
          test -s proj/rumble-forest-ds.nds

      - name: Upload NDS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumble-forest-ds
          path: proj/rumble-forest-ds.nds
          if-no-files-found: error
