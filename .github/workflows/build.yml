name: Build NDS

on:
  workflow_dispatch:
  push:
    paths:
      - '**.c'
      - '**.h'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NDS ROM
        run: |
          set -eu

          echo "=== CLONE EXAMPLES ==="
          REPO="https://github.com"
          git clone --depth 1 "$REPO/devkitPro/nds-examples.git"

          T=$(find nds-examples/templates -type d -name arm9 | head -n1)
          test -n "$T"
          cp -r "$T" proj

          sed -i 's|^LIBS := -lnds9$|LIBS := -lnds9 -lm|' proj/Makefile

          rm -f proj/source/*
          for f in main.c audio.h textures.h cars.h sounds.h images.h carimgs.h forestmap.h forestatlas.h; do
            if [ -f "source/$f" ]; then
              cp "source/$f" proj/source/
            elif [ -f "$f" ]; then
              cp "$f" proj/source/
            else
              echo "ERROR: File $f not found in root or source/!"
              exit 1
            fi
          done

          echo "=== MUSIC DATA (built into the game) ==="
          python3 - <<'PY'
          import os
          names = ['menu', 'race1', 'race2', 'race3', 'race4']
          out = open('proj/source/music_data.c', 'w')
          out.write('/* generated from music/*.bin by the build */\n')
          for n in names:
              data = b''
              for d in ('music', 'source/music', 'nitrofiles/music', '.'):
                  p = os.path.join(d, n + '.bin')
                  if os.path.isfile(p):
                      data = open(p, 'rb').read()
                      print('music', n, len(data), 'bytes from', p)
                      break
              out.write('const unsigned int musSize_%s = %d;\n' % (n, len(data)))
              out.write('const unsigned char musData_%s[%d] __attribute__((aligned(4))) = {\n' % (n, max(len(data), 4)))
              for i in range(0, len(data), 32):
                  out.write(','.join(str(b) for b in data[i:i + 32]) + ',\n')
              if not data:
                  out.write('0,0,0,0\n')
              out.write('};\n')
          out.close()
          PY
          test -s proj/source/music_data.c

          echo "=== BUILD ARM9 ==="
          make -C proj TARGET=Flatout-DS clean
          make -C proj TARGET=Flatout-DS

          ARM9_ELF="proj/Flatout-DS.elf"
          test -s "$ARM9_ELF"

          echo "=== LOCATE ARM7 ==="
          ARM7_ELF="$DEVKITPRO/calico/bin/ds7_maine.elf"
          if [ ! -s "$ARM7_ELF" ]; then
            ARM7_ELF="$DEVKITPRO/libnds/default.elf"
          fi
          test -s "$ARM7_ELF"
          echo "ARM7: $ARM7_ELF"

          echo "=== CREATE 32x32 ICON (Flatout DS) ==="
          python3 - <<'PY'
          import base64
          ICON = (
              "Qk12AgAAAAAAAHYAAAAoAAAAIAAAACAAAAABAAQAAAAAAAACAAATCwAAEwsAABAAAAAQAAAA/wD/"
              "AP///wDK//8AiuL/ANPu8ADX270AZKveABVv7gCGi3QAUVdUAAAb/gAOGYUAFhYiABYUAAAPAAAA"
              "AAAAAAAMEAAAAAAAAAAAAAAAAABeyd7+8AAAAAAAAAAAAAAAGcvZiJmdmd3sEAAAAAAAABaqvIlJ"
              "/MmIWf+ZiP/wAABTqqyNVqqru/Qbz/yF2d3hgne9iIaqcTq5Gqqqx6qqqwF3fP+Cp7gqrxqnOqtn"
              "qnsFZ3d/knd9N38XfGqoE2psCDqnNpR3fEd/VnxnpFlcPAFqq5WEZ3xHbGZ7N3Jnf2sBaqe1VTp8"
              "U3c3dzdzZ3d8AVOqv/kqfIJ3Z6czeWqqPACBZ3evOqv3evensn8aqR8AGBQzSIJneqq2erqsFrtf"
              "AAz/2RgRhhEjNRZne5Ks/wAP/4gtEVEY34EVURhRIisAH/xjNRj/if8R+JiWmBYwAP/5YYGf/4yI"
              "Ffn81gAAAAD/+WGF/ImYgR/5ycgQAAAA//kymBEZnvFf/PnJEAAAAP/5MogRhRGBX8/o2BAAAAD/"
              "/DKIHvEVERGf6fQQAAAAj/9iiY/4EYER/8nCEAAAAI//Yx9c8R/////JlAAAAAAM/5YZ+PkZ////"
              "/0EAAAAAAf/DMpyf////6ckgAAAAAAD/+UIVn/7//pyREAAAAAAAD/+TIhaUWIiZEQAAAAAAAACf"
              "+TIiOIZoMRAAAAAAAAAAGf/GIzIzEREAAAAAAAAAAAAP/8giIRIAAAAAAAAAAAAAAAAAAAAAAAAA"
              "AAAA"
          )
          open('proj/icon.bmp', 'wb').write(base64.b64decode(ICON))
          PY

          test -s proj/icon.bmp

          echo "=== LOCATE NDSTOOL ==="
          NDSTOOL=$(command -v ndstool || true)
          if [ -z "$NDSTOOL" ]; then
            NDSTOOL=$(find "$DEVKITPRO" -type f -name ndstool -perm -111 -print -quit)
          fi
          test -n "$NDSTOOL"
          echo "NDSTOOL: $NDSTOOL"

          echo "=== CREATE NDS ROM ==="
          "$NDSTOOL" -c proj/Flatout-DS.nds \
            -9 "$ARM9_ELF" \
            -7 "$ARM7_ELF" \
            -b proj/icon.bmp \
            "Flatout DS;Homebrew;devkitPro"

          echo "=== VERIFY ROM ==="
          ls -lh proj/Flatout-DS.nds
          test -s proj/Flatout-DS.nds

      - name: Upload NDS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flatout-DS
          path: proj/Flatout-DS.nds
          if-no-files-found: error
