
name: Build NDS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NDS ROM
        run: |
          set -eu

          echo "=== CLONE EXAMPLES ==="
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git

          T=$(find nds-examples/templates -type d -name arm9 | head -n1)
          test -n "$T"

          cp -r "$T" proj

          sed -i 's|^LIBS := -lnds9$|LIBS := -lnds9 -lm|' proj/Makefile

          rm -f proj/source/*
          cp main.c textures.h proj/source/

          echo "=== BUILD ARM9 ==="
          make -C proj TARGET=rumble-forest-ds clean
          make -C proj TARGET=rumble-forest-ds

          ARM9_ELF="proj/rumble-forest-ds.elf"

          echo "=== LOCATE ARM7 ==="
          ARM7_ELF=$(find "$DEVKITPRO" -type f -name "ds7_maine.elf" -print -quit)

          if [ -z "$ARM7_ELF" ]; then
            ARM7_ELF=$(find "$DEVKITPRO" -type f -path "*/libnds/default.elf" -print -quit)
          fi

          echo "=== LOCATE ICON ==="
          ICON=$(find "$DEVKITPRO" -type f -name "nds-icon.bmp" -print -quit)

          echo "ARM9: $ARM9_ELF"
          echo "ARM7: ${ARM7_ELF:-NOT FOUND}"
          echo "ICON: ${ICON:-NOT FOUND}"

          test -s "$ARM9_ELF"
          test -n "$ARM7_ELF"
          test -s "$ARM7_ELF"
          test -n "$ICON"
          test -s "$ICON"

          echo "=== LOCATE NDSTOOL ==="
          NDSTOOL=$(command -v ndstool || true)

          if [ -z "$NDSTOOL" ]; then
            NDSTOOL=$(find "$DEVKITPRO" -type f -name ndstool -perm -111 -print -quit)
          fi

          test -n "$NDSTOOL"

          echo "=== CREATE NDS ==="
          "$NDSTOOL" -c proj/rumble-forest-ds.nds \
            -9 "$ARM9_ELF" \
            -7 "$ARM7_ELF" \
            -b "$ICON" \
            "RumbleForest;Homebrew;devkitPro"

          echo "=== VERIFY ROM ==="
          ls -lh proj/rumble-forest-ds.nds
          test -s proj/rumble-forest-ds.nds

      - name: Upload NDS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumble-forest-ds
          path: proj/rumble-forest-ds.nds
          if-no-files-found: error
