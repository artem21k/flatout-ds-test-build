name: Build NDS

on:
  workflow_dispatch:
  push:
    paths:
      - '**.c'
      - '**.h'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NDS ROM
        run: |
          set -eu

          echo "=== CLONE EXAMPLES ==="
          REPO="https://github.com"
          git clone --depth 1 "$REPO/devkitPro/nds-examples.git"

          T=$(find nds-examples/templates -type d -name arm9 | head -n1)
          test -n "$T"
          cp -r "$T" proj

          sed -i 's|^LIBS := -lnds9$|LIBS := -lnds9 -lm|' proj/Makefile

          rm -f proj/source/*
          for f in main.c audio.h textures.h cars.h sounds.h images.h; do
            if [ -f "source/$f" ]; then
              cp "source/$f" proj/source/
            elif [ -f "$f" ]; then
              cp "$f" proj/source/
            else
              echo "ERROR: File $f not found in root or source/!"
              exit 1
            fi
          done

          echo "=== MUSIC DATA (built into the game) ==="
          python3 - <<'PY'
          import os
          names = ['menu', 'race1', 'race2', 'race3', 'race4']
          out = open('proj/source/music_data.c', 'w')
          out.write('/* generated from music/*.bin by the build */\n')
          for n in names:
              data = b''
              for d in ('music', 'source/music', 'nitrofiles/music', '.'):
                  p = os.path.join(d, n + '.bin')
                  if os.path.isfile(p):
                      data = open(p, 'rb').read()
                      print('music', n, len(data), 'bytes from', p)
                      break
              out.write('const unsigned int musSize_%s = %d;\n' % (n, len(data)))
              out.write('const unsigned char musData_%s[%d] __attribute__((aligned(4))) = {\n' % (n, max(len(data), 4)))
              for i in range(0, len(data), 32):
                  out.write(','.join(str(b) for b in data[i:i + 32]) + ',\n')
              if not data:
                  out.write('0,0,0,0\n')
              out.write('};\n')
          out.close()
          PY
          test -s proj/source/music_data.c

          echo "=== BUILD ARM9 ==="
          make -C proj TARGET=rumble-forest-ds clean
          make -C proj TARGET=rumble-forest-ds

          ARM9_ELF="proj/rumble-forest-ds.elf"
          test -s "$ARM9_ELF"

          echo "=== LOCATE ARM7 ==="
          ARM7_ELF="$DEVKITPRO/calico/bin/ds7_maine.elf"
          if [ ! -s "$ARM7_ELF" ]; then
            ARM7_ELF="$DEVKITPRO/libnds/default.elf"
          fi
          test -s "$ARM7_ELF"
          echo "ARM7: $ARM7_ELF"

          echo "=== CREATE 32x32 ICON ==="
          python3 - <<'PY'
          import struct

          width, height = 32, 32
          palette = [
              (0, 0, 0), (0, 0, 180), (0, 100, 255),
              (0, 180, 255), (0, 255, 0), (0, 180, 0),
              (255, 255, 0), (255, 180, 0), (255, 0, 0),
              (180, 0, 0), (255, 255, 255), (180, 180, 180),
              (100, 100, 100), (60, 60, 60), (255, 0, 255),
              (0, 255, 255)
          ]

          pixels = bytearray()
          for y in range(height - 1, -1, -1):
              for x in range(0, width, 2):
                  def color(px, py):
                      if 5 <= px < 27 and 5 <= py < 27:
                          return 3 if (px + py) % 4 < 2 else 2
                      return 1
                  pixels.append((color(x, y) << 4) | color(x + 1, y))

          palette_data = b''.join(struct.pack('<BBBB', b, g, r, 0) for r, g, b in palette)
          offset = 14 + 40 + len(palette_data)
          file_header = struct.pack('<2sIHHI', b'BM', offset + len(pixels), 0, 0, offset)
          dib_header = struct.pack('<IiiHHIIiiII', 40, width, height, 1, 4, 0, len(pixels), 2835, 2835, 16, 16)

          with open('proj/icon.bmp', 'wb') as f:
              f.write(file_header + dib_header + palette_data + pixels)
          PY

          test -s proj/icon.bmp

          echo "=== LOCATE NDSTOOL ==="
          NDSTOOL=$(command -v ndstool || true)
          if [ -z "$NDSTOOL" ]; then
            NDSTOOL=$(find "$DEVKITPRO" -type f -name ndstool -perm -111 -print -quit)
          fi
          test -n "$NDSTOOL"
          echo "NDSTOOL: $NDSTOOL"

          echo "=== CREATE NDS ROM ==="
          "$NDSTOOL" -c proj/rumble-forest-ds.nds \
            -9 "$ARM9_ELF" \
            -7 "$ARM7_ELF" \
            -b proj/icon.bmp \
            "RumbleForest;Homebrew;devkitPro"

          echo "=== VERIFY ROM ==="
          ls -lh proj/rumble-forest-ds.nds
          test -s proj/rumble-forest-ds.nds

      - name: Upload NDS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumble-forest-ds
          path: proj/rumble-forest-ds.nds
          if-no-files-found: error
