name: Build NDS

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git
          T=$(find nds-examples/templates -type d -name arm9 | head -n1)
          cp -r "$T" proj
          sed -i 's/^LIBS := -lnds9$/LIBS := -lnds9 -lm/' proj/Makefile
          rm -f proj/source/*
          cp main.c textures.h proj/source/
          make -C proj
          echo "=== SEARCHING FOR NDS FILES ==="
          find proj -type f
          echo "=== ROOT FILES ==="
          ls -la proj

      - uses: actions/upload-artifact@v4
        with:
          name: rumble-forest-ds
          path: proj/**/*.nds
