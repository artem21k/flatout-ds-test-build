
name: Build NDS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NDS ROM
        run: |
          set -eu

          echo "=== CLONE EXAMPLES ==="
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git

          T=$(find nds-examples/templates -type d -name arm9 | head -n1)
          test -n "$T"

          cp -r "$T" proj

          sed -i 's|^LIBS := -lnds9$|LIBS := -lnds9 -lm|' proj/Makefile

          rm -f proj/source/*
          cp main.c textures.h proj/source/

          echo "=== BUILD ARM9 ELF ==="
          make -C proj TARGET=rumble-forest-ds clean
          make -C proj TARGET=rumble-forest-ds

          echo "=== CHECK REQUIRED FILES ==="
          test -f proj/rumble-forest-ds.elf
          test -f "$DEVKITPRO/calico/bin/ds7_maine.elf"
          test -f "$DEVKITPRO/calico/share/nds-icon.bmp"

          echo "=== FIND NDSTOOL ==="
          NDSTOOL=$(command -v ndstool || true)

          if [ -z "$NDSTOOL" ]; then
            NDSTOOL=$(find "$DEVKITPRO" -type f -name ndstool -perm -111 -print -quit)
          fi

          test -n "$NDSTOOL"
          echo "Using: $NDSTOOL"

          echo "=== CREATE NDS ROM ==="
          "$NDSTOOL" -c proj/rumble-forest-ds.nds \
            -9 proj/rumble-forest-ds.elf \
            -7 "$DEVKITPRO/calico/bin/ds7_maine.elf" \
            -b "$DEVKITPRO/calico/share/nds-icon.bmp" \
            "RumbleForest;Homebrew;devkitPro"

          echo "=== VERIFY ROM ==="
          ls -lh proj/rumble-forest-ds.nds
          test -s proj/rumble-forest-ds.nds

      - name: Upload NDS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumble-forest-ds
          path: proj/rumble-forest-ds.nds
          if-no-files-found: error
